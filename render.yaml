services:
  - type: cron
    name: gtm-digest
    runtime: python
    schedule: "30 2 * * *"   # 8:00 AM IST
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
