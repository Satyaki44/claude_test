name: Daily GTM x AI Twitter Posts

on:
  schedule:
    - cron: '30 2 * * *'   # 8:00 AM IST (UTC+5:30) every day
  workflow_dispatch:         # manual trigger from GitHub UI anytime

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python main.py

      - name: Save digest to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p digests
          git add digests/ || true
          git diff --cached --quiet || git commit -m "digest: $(date -u +%Y-%m-%d)"
          git push
